import groovy.json.JsonOutput
import org.objectweb.asm.ClassReader
import org.objectweb.asm.Type
import org.objectweb.asm.tree.ClassNode
import java.util.zip.ZipFile

buildscript {
    repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm-tree:9.10.1' }
}

class WorldSafeDriverSources {
    final Map spec
    final File output
    final Map<String, ClassNode> classes = [:]
    final boolean official
    final List<String> mixins = []

    WorldSafeDriverSources(Map spec, File output, List<File> jars) {
        this.spec = spec; this.output = output; official = spec.namespace == 'official'
        jars.each { file ->
            new ZipFile(file).withCloseable { jar ->
                jar.entries().each { entry ->
                    if (entry.name.startsWith('net/minecraft/') && entry.name.endsWith('.class')) {
                        ClassNode node = new ClassNode()
                        new ClassReader(jar.getInputStream(entry)).accept(node, ClassReader.SKIP_CODE | ClassReader.SKIP_DEBUG | ClassReader.SKIP_FRAMES)
                        classes[node.name.replace('/', '.')] = node
                    }
                }
            }
        }
    }

    def method(String owner, List<String> names, Closure filter = { true }) {
        def result = classes[owner]?.methods?.find { names.contains(it.name) && filter(it) }
        if (result == null) { throw new GradleException("${spec.minecraft}: test driver requires ${owner} ${names}") }
        return result
    }
    boolean has(String owner, String name) { classes[owner]?.methods?.any { it.name == name } ?: false }
    def inheritedMethod(String owner, List<String> names, Closure filter = { true }) {
        String current = owner
        while (classes[current] != null) {
            def result = classes[current].methods.find { names.contains(it.name) && filter(it) }
            if (result != null) { return [owner: current, work: result] }
            current = classes[current].superName?.replace('/', '.')
        }
        throw new GradleException("${spec.minecraft}: test driver requires inherited ${owner} ${names}")
    }
    def inheritedField(String owner, Closure filter) {
        String current = owner
        while (classes[current] != null) {
            def field = classes[current].fields.find { (it.access & 8) == 0 && filter(it) }
            if (field != null) { return [owner: current, field: field] }
            current = classes[current].superName?.replace('/', '.')
        }
        throw new GradleException("${spec.minecraft}: native fixture field missing in ${owner}")
    }
    String setField(String name, String owner, def field, String receiver, String value) {
        String target = owner.contains('$') || (classes[owner].access & 1) == 0 ? '@Mixin(targets="' + owner + '")' : '@Mixin(' + owner + '.class)'
        write(name + 'Mixin', """
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.gen.Accessor;
${target}
public interface ${name}Mixin {
 @Accessor("${field.name}") void worldsafe_set${name}(${Type.getType(field.desc).className.replace('$', '.')} value);
}
""")
        return '((me.lele.worldSafe.fabric.driver.mixin.' + name + 'Mixin)(Object)' + receiver + ').worldsafe_set' + name + '(' + value + ')'
    }
    void write(String name, String body) {
        File file = new File(output, name + '.java')
        file.parentFile.mkdirs()
        String namespace = name.endsWith('Mixin') ? 'me.lele.worldSafe.fabric.driver.mixin' : 'me.lele.worldSafe.fabric.driver'
        if (name.endsWith('Mixin') && name != 'MinecraftClientMixin') { mixins.add(name) }
        file.setText('package ' + namespace + ';\nimport me.lele.worldSafe.fabric.driver.*;\n' + body, 'UTF-8')
    }
    String invoke(String name, String owner, def work, String receiver, List<String> inputs) {
        String target = owner.contains('$') || (classes[owner].access & 1) == 0 ? '@Mixin(targets="' + owner + '")' : '@Mixin(' + owner + '.class)'
        def parameters = Type.getArgumentTypes(work.desc).toList().withIndex().collect { type, index -> type.className.replace('$', '.') + ' arg' + index }
        write(name + 'Mixin', """
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.gen.Invoker;
${target}
public interface ${name}Mixin {
 @Invoker("${work.name}") ${Type.getReturnType(work.desc).className.replace('$', '.')} worldsafe_invoke${name}(${parameters.join(', ')});
}
""")
        return '((me.lele.worldSafe.fabric.driver.mixin.' + name + 'Mixin)(Object)' + receiver + ').worldsafe_invoke' + name + '(' + inputs.join(', ') + ')'
    }
    String entityClass(String type, String field) {
        String signature = classes[type].fields.find { it.name == field }?.signature
        def match = signature =~ /<L([^;]+);>/
        if (!match.find()) { throw new GradleException("${spec.minecraft}: entity type signature missing: ${field}") }
        return match.group(1).replace('/', '.')
    }
    boolean atLeast(String version) {
        def current = spec.minecraft.tokenize('.').collect { it as int }
        def required = version.tokenize('.').collect { it as int }
        for (int i = 0; i < 3; i++) {
            int left = i < current.size() ? current[i] : 0
            int right = i < required.size() ? required[i] : 0
            if (left != right) { return left > right }
        }
        return true
    }

    void generate() {
        String server = 'net.minecraft.server.MinecraftServer'
        String world = official ? 'net.minecraft.server.level.ServerLevel' : 'net.minecraft.server.world.ServerWorld'
        String baseWorld = official ? 'net.minecraft.world.level.Level' : 'net.minecraft.world.World'
        String entity = official ? 'net.minecraft.world.entity.Entity' : 'net.minecraft.entity.Entity'
        String pos = official ? 'net.minecraft.core.BlockPos' : 'net.minecraft.util.math.BlockPos'
        String blocks = official ? 'net.minecraft.world.level.block.Blocks' : 'net.minecraft.block.Blocks'
        String entityType = official ? (classes.containsKey('net.minecraft.world.entity.EntityTypes') ?
                'net.minecraft.world.entity.EntityTypes' : 'net.minecraft.world.entity.EntityType') : 'net.minecraft.entity.EntityType'
        String tnt = entityClass(entityType, 'TNT')
        String pig = entityClass(entityType, 'PIG')
        String creeper = entityClass(entityType, 'CREEPER')
        String crystal = entityClass(entityType, 'END_CRYSTAL')
        String positionSetter = method(entity, ['setPos', 'setPosition', 'updatePosition']) { it.desc == '(DDD)V' }.name
        String velocity = official ? 'getDeltaMovement' : 'getVelocity'
        String remove = has(entity, 'discard') ? 'discard' : 'remove'
        String removed = has(entity, 'isRemoved') ? 'isRemoved()' : 'removed'
        String spawn = official ? 'addFreshEntity' : 'spawnEntity'
        String setBlock = official ? 'setBlock' : 'setBlockState'
        String defaultState = official ? 'defaultBlockState' : 'getDefaultState'
        String worldKey = official || has(baseWorld, 'getRegistryKey') ? baseWorld : 'net.minecraft.world.dimension.DimensionType'
        String nether = classes[worldKey].fields.find { ['NETHER', 'THE_NETHER'].contains(it.name) }?.name
        if (nether == null) { throw new GradleException("${spec.minecraft}: test Nether key missing") }
        String worldGetter = method(server, ['getWorld', 'getLevel']) { Type.getArgumentTypes(it.desc).size() == 1 }.name
        String primary = classes[server].methods.find { ['getOverworld', 'getOverWorld', 'overworld'].contains(it.name) && it.desc == '()L' + world.replace('.', '/') + ';' }?.name
        String primaryExpression = primary != null ? 'server.' + primary + '()' : 'server.' + worldGetter + '(' + worldKey + '.OVERWORLD)'
        String manager = method(server, ['getCommandManager', 'getCommands']).name
        String commandSource = method(server, ['getCommandSource', 'createCommandSourceStack']).name
        String damageSource = official ? 'net.minecraft.world.damagesource.DamageSource' : 'net.minecraft.entity.damage.DamageSource'
        String genericDamage = classes[damageSource].fields.any { it.name == 'GENERIC' } ? damageSource + '.GENERIC' :
                'world.' + (official ? 'damageSources' : 'getDamageSources') + '().generic()'
        def crystalDamage = method(crystal, ['damage', 'hurtServer', 'hurt']) { Type.getArgumentTypes(it.desc).any { t -> t.className == damageSource } }
        String hurtArguments = Type.getArgumentTypes(crystalDamage.desc).collect { type ->
            if (type.className == damageSource) { return genericDamage }
            if (type.className == world) { return 'world' }
            if (type.sort == Type.FLOAT) { return '1.0f' }
            throw new GradleException("${spec.minecraft}: unsupported crystal damage test argument ${type}")
        }.join(', ')
        String noAi = official ? 'setNoAi' : 'setAiDisabled'
        String blockState = official ? 'net.minecraft.world.level.block.state.BlockState' : 'net.minecraft.block.BlockState'
        String tickEntity = method(world, ['tickEntity', 'tickNonPassenger']) { Type.getArgumentTypes(it.desc).size() == 1 }.name
        Map<String, String> mutations = [:]
        String farmland = official ? (classes.containsKey('net.minecraft.world.level.block.FarmlandBlock') ?
                'net.minecraft.world.level.block.FarmlandBlock' : 'net.minecraft.world.level.block.FarmBlock') : 'net.minecraft.block.FarmlandBlock'
        def fall = method(farmland, ['onLandedUpon', 'fallOn'])
        def fallArguments = Type.getArgumentTypes(fall.desc).collect { type ->
            if (type.className in [world, baseWorld]) { return 'world' }
            if (type.className == blockState) { return 'world.getBlockState(position)' }
            if (type.className == pos) { return 'position' }
            if (type.className == entity) { return 'pig' }
            if (type.sort == Type.FLOAT) { return '100.0f' }
            if (type.sort == Type.DOUBLE) { return '100.0d' }
            throw new GradleException("${spec.minecraft}: unsupported native fall argument ${type}")
        }
        mutations.cropTrampleProtection = """
 world.${setBlock}(position, ${blocks}.FARMLAND.${defaultState}(), 3);
 ${invoke('FarmlandFixture', farmland, fall, blocks + '.FARMLAND', fallArguments)};
 return world.getBlockState(position).getBlock() == ${blocks}.DIRT;
"""
        String egg = official ? 'net.minecraft.world.level.block.DragonEggBlock' : 'net.minecraft.block.DragonEggBlock'
        def teleport = method(egg, ['teleport'])
        def eggArguments = Type.getArgumentTypes(teleport.desc).collect { type ->
            if (type.className in [world, baseWorld]) { return 'world' }
            if (type.className == blockState) { return 'world.getBlockState(position)' }
            if (type.className == pos) { return 'position' }
            throw new GradleException("${spec.minecraft}: unsupported native egg teleport argument ${type}")
        }
        mutations.dragonEggTeleportationPrevention = """
 for (int x = 49; x <= 79; x++) for (int z = 49; z <= 79; z++) {
  world.${setBlock}(new ${pos}(x, 199, z), ${blocks}.STONE.${defaultState}(), 2);
 }
 world.${setBlock}(position, ${blocks}.DRAGON_EGG.${defaultState}(), 3);
 ${invoke('EggFixture', egg, teleport, blocks + '.DRAGON_EGG', eggArguments)};
 return world.getBlockState(position).getBlock() != ${blocks}.DRAGON_EGG;
"""
        String phantom = entityClass(entityType, 'PHANTOM')
        def attack = inheritedMethod(phantom, ['tryAttack', 'doHurtTarget']) { work ->
            Type.getArgumentTypes(work.desc).any { it.className == entity }
        }
        def attackArguments = Type.getArgumentTypes(attack.work.desc).collect { type ->
            if (type.className == world) { return 'world' }
            if (type.className == entity) { return 'pig' }
            throw new GradleException("${spec.minecraft}: unsupported native attack parameter ${type}")
        }
        mutations.phantomDamagePrevention = """
 ${phantom} phantom = new ${phantom}(${entityType}.PHANTOM, world);
 phantom.${positionSetter}(64.5, 201, 65.5);
 double health = pig.getHealth();
 try { ${invoke('PhantomAttackFixture', attack.owner, attack.work, 'phantom', attackArguments)}; }
 finally { phantom.${remove}(); }
 return pig.getHealth() < health;
"""
        String dragon = entityClass(entityType, 'ENDER_DRAGON')
        def destroy = classes[dragon].methods.find { work ->
            def args = Type.getArgumentTypes(work.desc)
            Type.getReturnType(work.desc).sort == Type.BOOLEAN && args.size() in [1, 2] &&
                    args[-1].className in ['net.minecraft.util.math.Box', 'net.minecraft.util.math.BoundingBox', 'net.minecraft.world.phys.AABB']
        }
        if (destroy == null) { throw new GradleException("${spec.minecraft}: native dragon destruction fixture unavailable") }
        def destroyArguments = Type.getArgumentTypes(destroy.desc).collect { type ->
            if (type.className == world) { return 'world' }
            return 'new ' + type.className + '(64, 200, 64, 65, 201, 65)'
        }
        mutations.enderDragonBlockDestructionProtection = """
 world.${setBlock}(position, ${blocks}.DIRT.${defaultState}(), 3);
 ${dragon} dragon = new ${dragon}(${entityType}.ENDER_DRAGON, world);
 dragon.${positionSetter}(64.5, 200, 64.5);
 if (!world.${spawn}(dragon)) throw new IllegalStateException("Cannot spawn dragon fixture");
 try { within(world, dragon, () -> { ${invoke('DragonDestroyFixture', dragon, destroy, 'dragon', destroyArguments)}; }); }
 finally { dragon.${remove}(); }
 return world.getBlockState(position).isAir();
"""
        String random = classes[baseWorld].fields.any { it.name == 'random' && (it.access & 1) != 0 } ? 'world.random' : 'world.getRandom()'
        String fire = official ? 'net.minecraft.world.level.block.FireBlock' : 'net.minecraft.block.FireBlock'
        def fireTick = method(fire, ['scheduledTick', 'onScheduledTick', 'tick'])
        def fireArguments = Type.getArgumentTypes(fireTick.desc).collect { type ->
            if (type.className in [world, baseWorld]) { return 'world' }
            if (type.className == blockState) { return blocks + '.FIRE.' + defaultState + '()' }
            if (type.className == pos) { return 'position' }
            if (type.className.contains('Random')) { return random }
            throw new GradleException("${spec.minecraft}: unsupported native fire tick parameter ${type}")
        }
        mutations.fireSpreadPrevention = """
 ${pos} wood = new ${pos}(65, 200, 64);
 world.${setBlock}(wood, ${blocks}.OAK_PLANKS.${defaultState}(), 3);
 try {
  for (int i = 0; i < 1000; i++) {
   world.${setBlock}(position, ${blocks}.FIRE.${defaultState}(), 3);
   ${invoke('FireSpreadFixture', fire, fireTick, blocks + '.FIRE', fireArguments)};
   if (world.getBlockState(wood).getBlock() != ${blocks}.OAK_PLANKS) return true;
  }
  return false;
 } finally { world.${setBlock}(wood, ${blocks}.AIR.${defaultState}(), 3); }
"""
        String lightning = official ? 'net.minecraft.world.entity.LightningBolt' : 'net.minecraft.entity.LightningEntity'
        def lightningConstructor = classes[lightning].methods.find { it.name == '<init>' && (it.access & 1) != 0 }
        def lightningArguments = Type.getArgumentTypes(lightningConstructor.desc).collect { type ->
            if (type.className in [world, baseWorld]) { return 'world' }
            if (type.className.endsWith('EntityType')) { return entityType + '.LIGHTNING_BOLT' }
            if (type.sort == Type.DOUBLE) { return '64.5d' }
            if (type.sort == Type.BOOLEAN) { return 'false' }
            throw new GradleException("${spec.minecraft}: unsupported lightning fixture constructor")
        }
        def spawnFire = method(lightning, ['spawnFire'])
        mutations.fireIgnitionPrevention = """
 ${lightning} lightning = new ${lightning}(${lightningArguments.join(', ')});
 lightning.${positionSetter}(64.5, 200, 64.5);
 world.${setBlock}(position, ${blocks}.AIR.${defaultState}(), 3);
 try { ${invoke('LightningFireFixture', lightning, spawnFire, 'lightning', ['0'])}; }
 finally { lightning.${remove}(); }
 return world.getBlockState(position).getBlock() == ${blocks}.FIRE;
"""
        String snowman = entityClass(entityType, 'SNOW_GOLEM')
        String snowMovement = method(snowman, ['tickMovement', 'aiStep']).name
        mutations.snowGolemSnowTrailPrevention = """
 ${snowman} snowman = new ${snowman}(${entityType}.SNOW_GOLEM, world);
 snowman.${positionSetter}(64.5, 200, 64.5);
 snowman.${noAi}(true);
 snowman.setNoGravity(true);
 try {
  if (!world.${spawn}(snowman)) throw new IllegalStateException("Cannot spawn snow golem fixture");
  within(world, snowman, () -> snowman.${snowMovement}());
  return world.getBlockState(position).getBlock() == ${blocks}.SNOW;
 } finally { snowman.${remove}(); }
"""
        String sheep = entityClass(entityType, 'SHEEP')
        String eatingGoal = official ? 'net.minecraft.world.entity.ai.goal.EatBlockGoal' : 'net.minecraft.entity.ai.goal.EatGrassGoal'
        mutations.sheepGrassEatingProtection = """
 world.${setBlock}(position, ${blocks}.GRASS_BLOCK.${defaultState}(), 3);
 ${sheep} sheep = new ${sheep}(${entityType}.SHEEP, world);
 sheep.${positionSetter}(64.5, 201, 64.5);
 sheep.${noAi}(true);
 sheep.setNoGravity(true);
 sheep.setSheared(true);
 ${eatingGoal} eating = new ${eatingGoal}(sheep);
 eating.start();
 try {
  within(world, sheep, () -> { for (int i = 0; i < 40; i++) eating.tick(); });
  if (sheep.isSheared()) throw new AssertionError("Grass protection removed vanilla wool regrowth");
  return world.getBlockState(position).getBlock() != ${blocks}.GRASS_BLOCK;
 } finally { sheep.${remove}(); }
"""
        String goalSelector = official ? 'net.minecraft.world.entity.ai.goal.GoalSelector' : 'net.minecraft.entity.ai.goal.GoalSelector'
        String goalClass = official ? 'net.minecraft.world.entity.ai.goal.Goal' : 'net.minecraft.entity.ai.goal.Goal'
        Map<String, Map> goals = [
                enderManBlockPickupProtection: [field: 'ENDERMAN', pattern: /(?i).*enderman.*\$.*(pick.*block|take.*block).*/],
                silverfishBlockChangeProtection: [field: 'SILVERFISH', pattern: /(?i).*silverfish.*\$.*(callforhelp|wakeupfriends).*/],
                rabbitCropEatingProtection: [field: 'RABBIT', pattern: /(?i).*rabbit.*\$.*(carrot|raidgarden).*/],
                foxBerryHarvestProtection: [field: 'FOX', pattern: /(?i).*fox.*\$.*berr.*/]
        ]
        goals.each { key, settings ->
            String actor = entityClass(entityType, settings.field)
            String target = classes.keySet().find { it ==~ settings.pattern }
            if (target == null) { throw new GradleException("${spec.minecraft}: native goal fixture missing for ${key}") }
            String marker = settings.field + 'GoalFixture'
            def tickGoal = method(target, ['tick'])
            String tickCall = invoke(marker, target, tickGoal, 'goal', [])
            String setup = ''
            String nativeBlock
            String initialState
            String changed
            String actorPosition
            int iterations
            if (settings.field == 'ENDERMAN') {
                nativeBlock = 'DIRT'; initialState = blocks + '.DIRT.' + defaultState + '()'
                changed = 'world.getBlockState(position).getBlock() != ' + blocks + '.DIRT'
                actorPosition = '63.5, 200, 64.5'; iterations = 1000
            } else if (settings.field == 'SILVERFISH') {
                nativeBlock = 'INFESTED_STONE'; initialState = blocks + '.' + nativeBlock + '.' + defaultState + '()'
                changed = 'world.getBlockState(position).getBlock() != ' + blocks + '.' + nativeBlock
                actorPosition = '64.5, 200, 64.5'; iterations = 2
                def timer = classes[target].fields.find { it.desc == 'I' && (it.access & 8) == 0 }
                if (timer == null) { throw new GradleException("${spec.minecraft}: silverfish help timer unavailable") }
                setup += setField(marker + 'Timer', target, timer, 'goal', '1') + ';\n'
            } else {
                String blockClass = (official ? 'net.minecraft.world.level.block.' : 'net.minecraft.block.') +
                        (settings.field == 'RABBIT' ? (official ? 'CarrotBlock' : 'CarrotsBlock') : 'SweetBerryBushBlock')
                nativeBlock = settings.field == 'RABBIT' ? 'CARROTS' : 'SWEET_BERRY_BUSH'
                int age = settings.field == 'RABBIT' ? 7 : 3
                initialState = blocks + '.' + nativeBlock + '.' + defaultState + '().' + (official ? 'setValue' : 'with') + '(' + blockClass + '.AGE, ' + age + ')'
                changed = '!world.getBlockState(position).equals(initial)'
                actorPosition = settings.field == 'RABBIT' ? '64.5, 200, 64.5' : '64.5, 201, 64.5'
                iterations = 60
                def targetPosition = inheritedField(target) { it.desc == 'L' + pos.replace('.', '/') + ';' }
                setup += setField(marker + 'Position', targetPosition.owner, targetPosition.field, 'goal',
                        settings.field == 'RABBIT' ? 'new ' + pos + '(64, 199, 64)' : 'position') + ';\n'
                classes[target].fields.findAll { it.desc == 'Z' && (it.access & 8) == 0 }.eachWithIndex { field, index ->
                    setup += setField(marker + 'Flag' + index, target, field, 'goal', 'true') + ';\n'
                }
            }
            mutations[key] = """
 world.${setBlock}(new ${pos}(64, 199, 64), ${blocks}.${settings.field == 'RABBIT' ? 'FARMLAND' : 'DIRT'}.${defaultState}(), 3);
 ${blockState} initial = ${initialState};
 world.${setBlock}(position, initial, 3);
 ${actor} actor = new ${actor}(${entityType}.${settings.field}, world);
 actor.${positionSetter}(${actorPosition});
 actor.${noAi}(true);
 actor.setNoGravity(true);
 Object goal = NativeGoals.find(actor, me.lele.worldSafe.fabric.driver.mixin.${marker}Mixin.class, ${goalSelector}.class, ${goalClass}.class);
 ${setup}
 try {
  within(world, actor, () -> { for (int i = 0; i < ${iterations} && !(${changed}); i++) { ${tickCall}; } });
  return ${changed};
 } finally { actor.${remove}(); }
"""
        }
        String farmer = classes.keySet().find { it.endsWith('.FarmerTask') || it.endsWith('.FarmerVillagerTask') || it.endsWith('.HarvestFarmland') }
        String villager = entityClass(entityType, 'VILLAGER')
        def farmTick = method(farmer, ['keepRunning', 'tick']) { Type.getArgumentTypes(it.desc).any { t -> t.className == world } }
        def farmlandPos = inheritedField(farmer) { it.desc == 'L' + pos.replace('.', '/') + ';' }
        String farmSetup = setField('FarmerPositionFixture', farmlandPos.owner, farmlandPos.field, 'task', 'position') + ';\n'
        classes[farmer].fields.findAll { it.desc in ['I', 'Z'] && (it.access & 8) == 0 }.eachWithIndex { field, index ->
            farmSetup += setField('FarmerStateFixture' + index, farmer, field, 'task', field.desc == 'I' ? '100' : 'true') + ';\n'
        }
        def farmArguments = Type.getArgumentTypes(farmTick.desc).collect { type ->
            if (type.className == world) { return 'world' }
            if (type.sort == Type.LONG) { return '1000L' }
            return 'actor'
        }
        String crop = official ? 'net.minecraft.world.level.block.CropBlock' : 'net.minecraft.block.CropBlock'
        String wheatAge = classes[crop].fields.find { it.name in ['AGE', 'AGE_7'] }?.name
        if (wheatAge == null) { throw new GradleException("${spec.minecraft}: mature crop fixture property unavailable") }
        mutations.villagerCropModificationProtection = """
 world.${setBlock}(new ${pos}(64, 199, 64), ${blocks}.FARMLAND.${defaultState}(), 3);
 world.${setBlock}(position, ${blocks}.WHEAT.${defaultState}().${official ? 'setValue' : 'with'}(${crop}.${wheatAge}, 7), 3);
 ${villager} actor = new ${villager}(${entityType}.VILLAGER, world);
 actor.${positionSetter}(64.5, 200, 64.5);
 actor.${noAi}(true);
 actor.setNoGravity(true);
 ${farmer} task = new ${farmer}();
 ${farmSetup}
 try {
  within(world, actor, () -> { ${invoke('FarmerTickFixture', farmer, farmTick, 'task', farmArguments)}; });
  return world.getBlockState(position).getBlock() != ${blocks}.WHEAT;
 } finally { actor.${remove}(); }
"""
        String ravager = entityClass(entityType, 'RAVAGER')
        String ravagerTick = method(ravager, ['tickMovement', 'aiStep']).name
        mutations.ravagerBlockDestructionProtection = """
 ${pos} leaves = new ${pos}(66, 200, 64);
 for (int y = 200; y <= 203; y++) for (int z = 63; z <= 65; z++)
  world.${setBlock}(new ${pos}(66, y, z), ${blocks}.OAK_LEAVES.${defaultState}(), 3);
 ${ravager} actor = new ${ravager}(${entityType}.RAVAGER, world);
 actor.${positionSetter}(64.5, 200, 64.5);
 actor.${noAi}(false);
 actor.setNoGravity(true);
 try {
  within(world, actor, () -> {
   actor.${official ? 'setDeltaMovement' : 'setVelocity'}(1, 0, 0);
   actor.${ravagerTick}();
  });
  System.out.println("WORLDSAFE_FIXTURE ravagerCollision=" + actor.horizontalCollision + " alive=" + actor.isAlive() + " difficulty=" + world.getDifficulty() + " box=" + actor.getBoundingBox());
  return world.getBlockState(leaves).getBlock() != ${blocks}.OAK_LEAVES;
 } finally {
  actor.${remove}();
  for (int y = 200; y <= 203; y++) for (int z = 63; z <= 65; z++)
   world.${setBlock}(new ${pos}(66, y, z), ${blocks}.AIR.${defaultState}(), 3);
 }
"""
