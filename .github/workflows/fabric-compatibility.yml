name: Fabric Code Compatibility Matrix

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of the verified universal Fabric JAR
        value: ${{ jobs.verify.outputs.sha256 }}

permissions:
  contents: read

jobs:
  verify:
    name: Fabric / 48 releases / code verification
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            gradle.properties
            gradle/*.gradle
            fabric/*.gradle
            shared/*.gradle
            fabric/versions.lock.json
            gradle/wrapper/gradle-wrapper.properties

      - name: Verify Fabric code matrix and build universal JAR
        run: ./gradlew --no-daemon -p fabric check shadowJar

      - name: Verify and record the exact release artifact
        id: digest
        run: |
          set -euo pipefail
          version="$(python3 scripts/project_version.py)"
          artifact="WorldSafe-Fabric-$version.jar"
          python3 scripts/verify-fabric-code.py "fabric/build/libs/$artifact"
          cp fabric/build/code-report.json "fabric/build/libs/WorldSafe-Fabric-$version-verification.json"
          cd fabric/build/libs
          shasum -a 256 "$artifact" > "$artifact.sha256"
          digest="$(shasum -a 256 "$artifact")"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "report=WorldSafe-Fabric-$version-verification.json" >> "$GITHUB_OUTPUT"
          cat "$artifact.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified Fabric release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fabric
          path: |
            fabric/build/libs/${{ steps.digest.outputs.artifact }}
            fabric/build/libs/${{ steps.digest.outputs.artifact }}.sha256
            fabric/build/libs/${{ steps.digest.outputs.report }}
          if-no-files-found: error
