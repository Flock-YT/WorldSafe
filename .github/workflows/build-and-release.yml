name: Build and Release WorldSafe

on:
  push:
    branches:
      - master
    paths:
      - gradle.properties
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldsafe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect project version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/detect-release.py

  build:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            *.gradle
            bukkit/*.gradle
            shared/*.gradle
            gradle.properties
            gradle/*.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Build Bukkit with Gradle
        run: ./gradlew --no-daemon bukkitClean bukkitBuild

      - name: Verify release JAR
        run: ./scripts/verify-release-jar.sh "bukkit/build/libs/${{ needs.detect-version.outputs.artifact }}" "${{ needs.detect-version.outputs.version }}"

      - name: Record verified JAR digest
        id: digest
        working-directory: bukkit/build/libs
        env:
          ARTIFACT: ${{ needs.detect-version.outputs.artifact }}
        run: |
          set -euo pipefail
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          digest="$(shasum -a 256 "$ARTIFACT")"
          echo "sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
          cat "$ARTIFACT.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-jar
          path: |
            bukkit/build/libs/${{ needs.detect-version.outputs.artifact }}
            bukkit/build/libs/${{ needs.detect-version.outputs.artifact }}.sha256
          if-no-files-found: error

  compatibility:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    uses: ./.github/workflows/compatibility-matrix.yml

  fabric:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    uses: ./.github/workflows/fabric-compatibility.yml

  release:
    needs:
      - detect-version
      - build
      - compatibility
      - fabric
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-jar
          path: dist

      - name: Download verified Fabric release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-fabric
          path: dist

      - name: Fail if tag already exists
        env:
          TAG: ${{ needs.detect-version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-version.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_FABRIC_SHA256: ${{ needs.fabric.outputs.sha256 }}
        run: |
          bash scripts/create-release.sh "$VERSION" dist "$EXPECTED_SHA256" "$EXPECTED_FABRIC_SHA256"
