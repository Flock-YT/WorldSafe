   world.${setBlock}(new ${pos}(64 + x, 200, 64 + z), ${blocks}.DIRT.${defaultState}(), 3);
   total++;
  }
  ${pig} pig = new ${pig}(${entityType}.PIG, world);
  pig.${positionSetter}(64.5, 200, ("ghast".equals(source) || "skull".equals(source)) ? 65.8 : 69.5);
  if (!world.${spawn}(pig)) throw new IllegalStateException("Cannot spawn explosion witness");
  double initialHealth = pig.getHealth();
  ${entity} sourceEntity;
  Boolean sourceRetained = null;
  if ("tnt".equals(source)) {
   ${tnt} tnt = new ${tnt}(${entityType}.TNT, world);
   tnt.${positionSetter}(64.5, 200, 64.5);
   tnt.setFuse(0);
   if (!world.${spawn}(tnt)) throw new IllegalStateException("Cannot spawn TNT");
   sourceEntity = tnt;
   tnt.tick();
  } else if ("creeper".equals(source)) {
   ${creeper} creeper = new ${creeper}(${entityType}.CREEPER, world);
   creeper.${positionSetter}(64.5, 200, 64.5);
   creeper.setNoGravity(true);
   creeper.${noAi}(true);
   if (!world.${spawn}(creeper)) throw new IllegalStateException("Cannot spawn creeper");
   sourceEntity = creeper;
   creeper.${primeCreeper.name}(${primeArguments});
   for (int i = 0; i < 40 && !creeper.${removed}; i++) creeper.tick();
  } else if ("crystal".equals(source)) {
   ${crystal} crystal = new ${crystal}(${entityType}.END_CRYSTAL, world);
   crystal.${positionSetter}(64.5, 200, 64.5);
   if (!world.${spawn}(crystal)) throw new IllegalStateException("Cannot spawn crystal");
   sourceEntity = crystal;
   crystal.${crystalDamage.name}(${hurtArguments});
  } else if ("wither".equals(source)) {
   ${wither} wither = new ${wither}(${entityType}.WITHER, world);
   wither.${positionSetter}(64.5, 200, 64.5);
   wither.setNoGravity(true);
   wither.${invulTimer.name}(1);
   if (!world.${spawn}(wither)) throw new IllegalStateException("Cannot spawn wither");
   sourceEntity = wither;
   wither.tick();
  } else if ("ghast".equals(source)) {
   ${ghast} ghast = new ${ghast}(${entityType}.GHAST, world);
   ${fireball} fireball = new ${fireball}(${entityType}.FIREBALL, world);
   ${projectileOwner}
   fireball.${positionSetter}(64.5, 200, 64.5);
   if (!world.${spawn}(fireball)) throw new IllegalStateException("Cannot spawn ghast fireball");
   sourceEntity = fireball;
   ${collisionCall};
   ghast.${remove}();
  } ${extraBlasts.collect { kind, body -> 'else if ("' + kind + '".equals(source)) {\n' + body + '\n}' }.join(' ')} else throw new IllegalArgumentException(source);
  int destroyed = 0;
  for (int x = 1; x <= 2; x++) for (int z = -1; z <= 1; z++) {
   ${pos} position = new ${pos}(64 + x, 200, 64 + z);
   if (world.getBlockState(position).isAir()) destroyed++;
   world.${setBlock}(position, ${blocks}.AIR.${defaultState}(), 3);
  }
  double speed = pig.${velocity}().x * pig.${velocity}().x + pig.${velocity}().y * pig.${velocity}().y + pig.${velocity}().z * pig.${velocity}().z;
  double health = pig.getHealth();
  pig.${remove}();
  if (sourceEntity != null) sourceEntity.${remove}();
  return new BlastObservation(destroyed, initialHealth, health, speed, sourceRetained);
 }
}
""")
        // The client is not a headless substitute: it opens its saved world,
        // joins the integrated server, and executes the actual command tree.
        String client = official ? 'net.minecraft.client.Minecraft' : 'net.minecraft.client.MinecraftClient'
        String title = classes.containsKey('net.minecraft.client.gui.MainMenuScreen') ? 'net.minecraft.client.gui.MainMenuScreen' :
                (official ? 'net.minecraft.client.gui.screens.TitleScreen' : 'net.minecraft.client.gui.screen.TitleScreen')
        String ready = has(client, 'isGameLoadFinished') ? 'client.isGameLoadFinished()' :
                'client.' + (classes[client].fields.find { it.name in ['currentScreen', 'screen'] }?.name ?: 'currentScreen') + ' instanceof ' + title
        String open
        if (has(client, 'createWorldOpenFlows')) { open = 'client.createWorldOpenFlows().openWorld("architecture-probe", () -> { throw new IllegalStateException("World load failed"); });' }
        else if (has(client, 'createIntegratedServerLoader')) {
            String loader = Type.getReturnType(method(client, ['createIntegratedServerLoader']).desc).className
            def start = classes[loader].methods.findAll { it.name == 'start' && (it.access & 1) != 0 &&
                    Type.getArgumentTypes(it.desc).any { t -> t.className == 'java.lang.String' } }.min { Type.getArgumentTypes(it.desc).size() }
            if (start == null) { throw new GradleException("${spec.minecraft}: integrated world loading entry missing") }
            def args = Type.getArgumentTypes(start.desc).collect { type ->
                if (type.className == 'java.lang.String') { return '"architecture-probe"' }
                if (type.className == 'java.lang.Runnable') { return '() -> { throw new IllegalStateException("World load failed"); }' }
                if (type.className.endsWith('.Screen')) { return 'null' }
                throw new GradleException("${spec.minecraft}: unsupported integrated world loading parameter ${type}")
            }
            open = 'client.createIntegratedServerLoader().start(' + args.join(', ') + ');'
        }
        else {
            def candidates = classes[client].methods.findAll { it.name == 'startIntegratedServer' && Type.getArgumentTypes(it.desc).size() > 0 && Type.getArgumentTypes(it.desc)[0].className == 'java.lang.String' }
            def start = candidates.min { Type.getArgumentTypes(it.desc).size() }
            if (start == null) { throw new GradleException("${spec.minecraft}: singleplayer loading entry missing") }
            List<String> args = Type.getArgumentTypes(start.desc).collect { type ->
                if (type.className == 'java.lang.String') { return '"architecture-probe"' }
                if (type.sort == Type.BOOLEAN) { return 'false' }
                if (type.sort in [Type.INT, Type.LONG, Type.FLOAT, Type.DOUBLE]) { return '0' }
                return 'null'
            }
            open = 'client.' + start.name + '(' + args.join(', ') + ');'
        }
        String getServer = method(client, ['getServer', 'getSingleplayerServer']).name
        String stop = has(client, 'scheduleStop') ? 'scheduleStop' : 'stop'
        write('MinecraftClientMixin', """
import org.spongepowered.asm.mixin.*;
import org.spongepowered.asm.mixin.injection.*;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
@Mixin(${client}.class)
public abstract class MinecraftClientMixin {
 @Unique private boolean worldsafe_started;
 @Unique private boolean worldsafe_dispatched;
 @Inject(method="tick", at=@At("TAIL"))
 private void worldsafe_tick(CallbackInfo callback) {
  ${client} client = ${client}.getInstance();
  if (!worldsafe_started && ${ready}) {
   worldsafe_started = true;
   System.out.println("WORLDSAFE_ARCHITECTURE stage=opening-singleplayer-world");
   ${open}
  }
  ${server} server = client.${getServer}();
  if (!worldsafe_dispatched && client.player != null && server != null
    && (!Boolean.getBoolean("worldsafe.behaviorTests") || BehaviorSuite.completed(server))) {
   worldsafe_dispatched = true;
   server.execute(() -> {
    try {
     int result = server.${manager}().getDispatcher().execute("worldsafe help", server.${commandSource}());
     if (result != 1) throw new IllegalStateException("Probe command failed");
     System.out.println("WORLDSAFE_ARCHITECTURE stage=integrated-command-confirmed");
     client.execute(() -> client.${stop}());
    } catch (Exception error) { throw new IllegalStateException(error); }
   });
  }
 }
}
""")
        def tick = method(server, ['tick', 'tickServer']) { Type.getReturnType(it.desc).sort == Type.VOID }
        write('ServerBehaviorMixin', """
import org.spongepowered.asm.mixin.*;
import org.spongepowered.asm.mixin.injection.*;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
@Mixin(${server}.class)
public abstract class ServerBehaviorMixin {
 @Unique private boolean worldsafe_tested;
 @Unique private int worldsafe_ticks;
 @Inject(method="${tick.name + tick.desc}", at=@At("TAIL"))
 private void worldsafe_test(CallbackInfo callback) {
  if (!worldsafe_tested && Boolean.getBoolean("worldsafe.behaviorTests")) {
   NativeFixture fixture = new NativeFixtureImpl(this);
   if (fixture.primaryWorld() != null) {
    if (worldsafe_ticks++ == 0) {
     try { fixture.prepare(); } catch (Exception error) { throw new IllegalStateException("Cannot prepare native fixtures", error); }
    }
    if (worldsafe_ticks >= 100) { worldsafe_tested = true; BehaviorSuite.run(fixture); }
   }
  }
 }
}
""")
        write('FixtureEntityTickMixin', """
import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.injection.*;
import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;
@Mixin(${world}.class)
public abstract class FixtureEntityTickMixin {
 @Inject(method="${tickEntity}(L${entity.replace('.', '/')};)V", at=@At("HEAD"))
 private void worldsafe_fixture(${entity} entity, CallbackInfo callback) { NativeTestTasks.tick(entity); }
}
