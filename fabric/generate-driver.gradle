def driverSources = layout.buildDirectory.dir('generated/driver-sources')
tasks.register('generateDriverSources') {
    inputs.file(rootProject.file('generate-driver.gradle'))
    inputs.property('target', project.targetSpec)
    outputs.dir(driverSources)
    doLast {
        File directory = driverSources.get().asFile
        project.delete(directory)
        def extension = project.extensions.getByName('loom')
        def namespaces = extension.class.classLoader.loadClass('net.fabricmc.loom.api.mappings.layered.MappingsNamespace')
        def named = namespaces.enumConstants.find { it.name() == 'NAMED' }
        new WorldSafeDriverSources(project.targetSpec, directory, extension.getMinecraftJars(named).collect { it.toFile() }).generate()
    }
}
sourceSets.main.java.srcDir(driverSources)
tasks.named('compileJava') { dependsOn('generateDriverSources') }
project.ext.driverSourcesDirectory = driverSources
tasks.named('driverMetadata') {
    dependsOn('generateDriverSources')
    inputs.file(driverSources.map { it.file('mixins.json') })
}
