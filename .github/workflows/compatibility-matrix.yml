name: Bukkit API Compatibility Matrix

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests / Spigot 1.8.8 / JDK 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify with Maven
        run: mvn -B --no-transfer-progress clean verify

  compile:
    name: Spigot ${{ matrix.api }} / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 1.8.8-R0.1-SNAPSHOT
            java: '17'
          - api: 1.9.4-R0.1-SNAPSHOT
            java: '17'
          - api: 1.10.2-R0.1-SNAPSHOT
            java: '17'
          - api: 1.11.2-R0.1-SNAPSHOT
            java: '17'
          - api: 1.12.2-R0.1-SNAPSHOT
            java: '17'
          - api: 1.13.2-R0.1-SNAPSHOT
            java: '17'
          - api: 1.14.4-R0.1-SNAPSHOT
            java: '17'
          - api: 1.15.2-R0.1-SNAPSHOT
            java: '17'
          - api: 1.16.5-R0.1-SNAPSHOT
            java: '17'
          - api: 1.17.1-R0.1-SNAPSHOT
            java: '17'
          - api: 1.18.2-R0.1-SNAPSHOT
            java: '17'
          - api: 1.19.4-R0.1-SNAPSHOT
            java: '17'
          - api: 1.20.3-R0.1-SNAPSHOT
            java: '17'
          - api: 1.20.6-R0.1-SNAPSHOT
            java: '21'
          - api: 1.21-R0.1-SNAPSHOT
            java: '21'
          - api: 1.21.11-R0.1-SNAPSHOT
            java: '21'
          - api: 26.1.2-R0.1-SNAPSHOT
            java: '25'
          - api: 26.2-R0.1-SNAPSHOT
            java: '25'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile against Spigot API ${{ matrix.api }}
        run: >-
          mvn -B --no-transfer-progress clean package
          -Dspigot.version=${{ matrix.api }}
          -Dmaven.test.skip=true
