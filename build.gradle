plugins { id 'base' }

apply from: file('gradle/project-version.gradle')
def releaseVersion = project.version.toString()

tasks.register('pythonTests', Exec) {
    group = 'verification'
    workingDir(rootDir)
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tests', '-v'
}
tasks.named('clean') { dependsOn(':bukkit:clean', ':shared:clean') }
tasks.named('assemble') { dependsOn(':bukkit:assemble') }
tasks.named('check') { dependsOn(':bukkit:check', ':shared:check', 'pythonTests') }

// A nested build preserves Fabric's rootProject assumptions and keeps Bukkit configuration lightweight.
tasks.register('fabricBuild', GradleBuild) {
    group = 'build'
    description = 'Build and check all selected Fabric runtimes (requires JDK 25).'
    dir = file('fabric')
    tasks = ['check', 'shadowJar']
    startParameter.projectProperties = gradle.startParameter.projectProperties
    doFirst {
        if (JavaVersion.current() < JavaVersion.VERSION_25) {
            throw new GradleException('fabricBuild and buildAll must run on JDK 25')
        }
    }
}
tasks.register('verifyFabricJar', Exec) {
    group = 'verification'
    dependsOn('fabricBuild')
    workingDir(rootDir)
    commandLine 'python3', 'scripts/verify-fabric-code.py',
            "fabric/build/libs/WorldSafe-Fabric-${releaseVersion}.jar"
}
tasks.register('buildAll') {
    group = 'build'
    description = 'Build, test and verify both release JARs (requires JDK 25).'
    dependsOn('build', 'verifyFabricJar')
}
