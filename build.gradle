plugins { id 'base' }

apply from: file('gradle/project-version.gradle')
def releaseVersion = project.version.toString()

tasks.register('pythonTests', Exec) {
    group = 'verification'
    workingDir(rootDir)
    commandLine 'python3', '-m', 'unittest', 'discover', '-s', 'tests', '-v'
}
tasks.register('bukkitClean') {
    group = 'bukkit'
    description = 'Clean Bukkit and shared build outputs.'
    dependsOn(':bukkit:clean')
}
tasks.register('fabricClean') {
    group = 'fabric'
    description = 'Clean Fabric build outputs, including test worlds (no JDK 25 required).'
    dependsOn(':fabric:clean')
}
tasks.named('clean') {
    description = 'Clean all platform build outputs, including Fabric test worlds.'
    dependsOn('bukkitClean', 'fabricClean')
}
tasks.named('assemble') { dependsOn(':bukkit:assemble') }
tasks.named('check') { dependsOn(':bukkit:check', ':shared:check', 'pythonTests') }

tasks.register('bukkitBuild') {
    group = 'bukkit'
    description = 'Build, test and verify Bukkit and the shared core (JDK 17).'
    dependsOn(':bukkit:build')
}
// A nested build preserves Fabric's rootProject assumptions and keeps Bukkit configuration lightweight.
tasks.register('fabricArtifacts', GradleBuild) {
    description = 'Build and check all selected Fabric runtimes (requires JDK 25).'
    mustRunAfter('clean', 'fabricClean', ':fabric:clean')
    dir = file('fabric')
    buildName = 'fabricRuntimes'
    tasks = ['check', 'shadowJar']
    startParameter.projectProperties = gradle.startParameter.projectProperties
    doFirst {
        if (JavaVersion.current() < JavaVersion.VERSION_25) {
            throw new GradleException('build and fabricBuild must run on JDK 25; use bukkitBuild for Bukkit on JDK 17')
        }
    }
}
tasks.register('verifyFabricJar', Exec) {
    group = 'verification'
    dependsOn('fabricArtifacts')
    workingDir(rootDir)
    commandLine 'python3', 'scripts/verify-fabric-code.py',
            "fabric/build/libs/WorldSafe-Fabric-${releaseVersion}.jar"
}
tasks.register('fabricBuild') {
    group = 'fabric'
    description = 'Build, test and verify the universal Fabric JAR (requires JDK 25).'
    dependsOn(':fabric:build')
}
tasks.named('build') {
    description = 'Build, test and verify both release JARs (requires JDK 25).'
    dependsOn('bukkitBuild', 'fabricBuild')
}
