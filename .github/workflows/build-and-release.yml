name: Build and Release Bukkit Plugin

on:
  push:
    branches:
      - master
    paths:
      - pom.xml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldsafe-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Detect Maven version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          read_version() {
            mvn -q -Dstyle.color=never -f "$1" help:evaluate \
              -Dexpression=project.version \
              -DforceStdout 2>/dev/null | tr -d '\r'
          }

          current_version="$(read_version pom.xml)"
          if [[ ! "$current_version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven project.version: $current_version" >&2
            exit 1
          fi

          should_release=false
          previous_version='<manual>'

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$GITHUB_REF" != 'refs/heads/master' ]]; then
              echo "Manual releases must run from the master branch." >&2
              exit 1
            fi
            should_release=true
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            previous_version='<none>'
            should_release=true
          else
            git show "${BEFORE_SHA}:pom.xml" > "$RUNNER_TEMP/pom-before.xml"
            previous_version="$(read_version "$RUNNER_TEMP/pom-before.xml")"
            if [[ "$previous_version" != "$current_version" ]]; then
              should_release=true
            fi
          fi

          echo "Previous version: $previous_version"
          echo "Current version: $current_version"
          echo "Release required: $should_release"

          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"
          echo "artifact=WorldSafe-$current_version.jar" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B --no-transfer-progress clean verify

      - name: Verify release JAR
        run: ./scripts/verify-release-jar.sh "target/${{ needs.detect-version.outputs.artifact }}" "${{ needs.detect-version.outputs.version }}"

      - name: Upload release JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-jar
          path: target/${{ needs.detect-version.outputs.artifact }}
          if-no-files-found: error

  release:
    needs:
      - detect-version
      - build
    if: needs.detect-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download release JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-jar
          path: dist

      - name: Fail if tag already exists
        env:
          TAG: ${{ needs.detect-version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect-version.outputs.tag }}
          ARTIFACT: ${{ needs.detect-version.outputs.artifact }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "dist/$ARTIFACT" \
            --target "$GITHUB_SHA" \
            --title "WorldSafe $TAG" \
            --generate-notes
